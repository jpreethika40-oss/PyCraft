<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyCraft</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="chat-app">
    <!-- Header: Clean text-only PyCraft wordmark -->
    <header class="chat-header">
      <div class="header-inner">
        <h1 class="brand-title">PyCraft</h1>
        <button type="button" id="new-chat-btn" class="header-btn" title="Start a fresh conversation" aria-label="New Chat">
          New Chat
        </button>
      </div>
    </header>

    <!-- Error Notification Banner -->
    <div id="error-banner" class="error-banner" role="alert" hidden>
      <span id="error-banner-text" class="error-text"></span>
      <button type="button" id="dismiss-error-btn" class="dismiss-btn" aria-label="Dismiss error">&times;</button>
    </div>

    <!-- Main Content Area -->
    <main id="chat-main" class="chat-main">
      <!-- Welcome Empty State (shown before first message) -->
      <div id="empty-state" class="empty-state">
        <h2 class="empty-title">How can I help you today?</h2>
        <p class="empty-desc">Ask anything &mdash; from coding and debugging to concepts, comparisons, and general knowledge.</p>
        <div class="suggestions-grid">
          <button type="button" class="suggestion-card" data-prompt="Explain the difference between a process and a thread.">
            <span class="suggestion-topic">Concepts</span>
            <span class="suggestion-text">Process vs. thread explanation</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Write a Python function to check for balanced brackets in an expression.">
            <span class="suggestion-topic">Python</span>
            <span class="suggestion-text">Check for balanced brackets</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Write a Java method to reverse a singly linked list.">
            <span class="suggestion-topic">Java</span>
            <span class="suggestion-text">Reverse a singly linked list</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="How do database indexes speed up SQL queries?">
            <span class="suggestion-topic">SQL</span>
            <span class="suggestion-text">How indexes optimize queries</span>
          </button>
        </div>
      </div>

      <!-- Messages Conversation Container -->
      <div id="messages-container" class="messages-container" aria-live="polite">
        <div id="messages-list" class="messages-list"></div>
      </div>
    </main>

    <!-- Message Composer Area -->
    <footer class="chat-footer">
      <form id="chat-form" class="chat-form">
        <div class="composer-box">
          <textarea
            id="message-input"
            class="message-input"
            rows="1"
            placeholder="Send a message..."
            aria-label="Message input"
            required
          ></textarea>
          <button type="submit" id="send-button" class="send-button" aria-label="Send message">
            <svg class="send-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
              <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
            </svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
