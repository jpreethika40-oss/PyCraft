<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyCraft</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="chat-app">
    <!-- Header: Clean text-only PyCraft wordmark and navigation -->
    <header class="chat-header">
      <div class="header-inner">
        <h1 class="brand-title">PyCraft</h1>
        <div class="header-actions">
          <button type="button" id="workspace-toggle-btn" class="header-btn" title="View Workspace Files" aria-label="Toggle Workspace Files" aria-expanded="false">
            <svg class="header-icon" viewBox="0 0 20 20" fill="currentColor" width="15" height="15" aria-hidden="true">
              <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
            </svg>
            <span>Workspace</span>
            <span id="workspace-badge" class="workspace-badge" hidden>0</span>
          </button>
          <button type="button" id="new-chat-btn" class="header-btn" title="Start a fresh conversation" aria-label="New Chat">
            New Chat
          </button>
        </div>
      </div>
    </header>

    <!-- Error Notification Banner -->
    <div id="error-banner" class="error-banner" role="alert" hidden>
      <span id="error-banner-text" class="error-text"></span>
      <button type="button" id="dismiss-error-btn" class="dismiss-btn" aria-label="Dismiss error">&times;</button>
    </div>

    <!-- Main Content Area -->
    <main id="chat-main" class="chat-main">
      <!-- Welcome Empty State (shown before first message) -->
      <div id="empty-state" class="empty-state">
        <h2 class="empty-title">How can I help you today?</h2>
        <p class="empty-desc">Ask anything &mdash; from coding and debugging to concepts, comparisons, and general knowledge.</p>
        <div class="suggestions-grid">
          <button type="button" class="suggestion-card" data-prompt="Explain the difference between a process and a thread.">
            <span class="suggestion-topic">Concepts</span>
            <span class="suggestion-text">Process vs. thread explanation</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Write a Python function to check for balanced brackets in an expression.">
            <span class="suggestion-topic">Python</span>
            <span class="suggestion-text">Check for balanced brackets</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Write a Java method to reverse a singly linked list.">
            <span class="suggestion-topic">Java</span>
            <span class="suggestion-text">Reverse a singly linked list</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="How do database indexes speed up SQL queries?">
            <span class="suggestion-topic">SQL</span>
            <span class="suggestion-text">How indexes optimize queries</span>
          </button>
        </div>
      </div>

      <!-- Messages Conversation Container -->
      <div id="messages-container" class="messages-container" aria-live="polite">
        <div id="messages-list" class="messages-list"></div>
      </div>
    </main>

    <!-- Message Composer Area -->
    <footer class="chat-footer">
      <form id="chat-form" class="chat-form">
        <div class="composer-box">
          <textarea
            id="message-input"
            class="message-input"
            rows="1"
            placeholder="Send a message..."
            aria-label="Message input"
            required
          ></textarea>
          <button type="submit" id="send-button" class="send-button" aria-label="Send message">
            <svg class="send-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
              <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
            </svg>
          </button>
        </div>
      </form>
    </footer>

    <!-- Workspace Panel (Collapsible Drawer) -->
    <aside id="workspace-panel" class="workspace-panel" aria-label="Workspace Files" hidden>
      <div class="workspace-header">
        <div class="workspace-title-group">
          <svg class="workspace-folder-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
          </svg>
          <h2 class="workspace-title">Workspace Files</h2>
        </div>
        <div class="workspace-header-actions">
          <button type="button" id="workspace-refresh-btn" class="icon-btn" title="Refresh files" aria-label="Refresh workspace files">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.099a1 1 0 01.762 1.185A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.608-1.234z" clip-rule="evenodd"/>
            </svg>
          </button>
          <button type="button" id="workspace-close-btn" class="icon-btn close-btn" title="Close workspace panel" aria-label="Close workspace panel">
            &times;
          </button>
        </div>
      </div>

      <div class="workspace-body">
        <!-- Loading State -->
        <div id="workspace-loading" class="workspace-state" hidden>
          <div class="loading-spinner"></div>
          <span>Loading files...</span>
        </div>

        <!-- Error State -->
        <div id="workspace-error" class="workspace-state workspace-error-state" hidden>
          <span id="workspace-error-text" class="workspace-error-text"></span>
          <button type="button" id="workspace-retry-btn" class="workspace-retry-btn">Retry</button>
        </div>

        <!-- File List View -->
        <div id="workspace-list-view" class="workspace-list-view">
          <ul id="workspace-file-list" class="workspace-file-list" role="list"></ul>
          <div id="workspace-empty" class="workspace-empty" hidden>
            <p>No accessible files in workspace.</p>
          </div>
        </div>

        <!-- File Content Preview (Read-only) -->
        <div id="workspace-viewer" class="workspace-viewer" hidden>
          <div class="viewer-top-bar">
            <button type="button" id="viewer-back-btn" class="viewer-back-btn" aria-label="Back to file list">
              &larr; Back
            </button>
            <div class="viewer-file-meta">
              <span id="viewer-file-path" class="viewer-file-path"></span>
              <span id="viewer-file-size" class="viewer-file-size"></span>
            </div>
          </div>
          <div id="viewer-loading" class="workspace-state" hidden>
            <div class="loading-spinner"></div>
            <span>Reading file...</span>
          </div>
          <div id="viewer-error" class="workspace-state workspace-error-state" hidden>
            <span id="viewer-error-text" class="workspace-error-text"></span>
          </div>
          <div id="viewer-content-container" class="viewer-content-container">
            <pre class="viewer-pre"><code id="viewer-code" class="viewer-code"></code></pre>
          </div>
        </div>
      </div>
    </aside>

    <!-- Backdrop for mobile drawer -->
    <div id="workspace-backdrop" class="workspace-backdrop" hidden></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
